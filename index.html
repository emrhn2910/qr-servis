<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Lounge Servis Asistanı</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #08080a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; overflow-x: hidden; }
        
        .glow-bg { position: fixed; width: 300px; height: 300px; background: radial-gradient(circle, rgba(255, 179, 0, 0.15) 0%, rgba(0,0,0,0) 70%); top: -50px; left: 50%; transform: translateX(-50%); z-index: 0; pointer-events: none; }
        
        .app-card { position: relative; z-index: 1; background: rgba(20, 20, 26, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 28px; padding: 28px 22px; width: 100%; max-width: 400px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
        
        .brand { text-align: center; margin-bottom: 24px; }
        .brand-logo { font-size: 32px; margin-bottom: 4px; display: inline-block; }
        .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: #fff; margin: 0; text-transform: uppercase; }
        .brand p { font-size: 12px; color: #ffb300; letter-spacing: 1px; margin-top: 4px; text-transform: uppercase; font-weight: 600; opacity: 0.9; }

        .masa-box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 14px; margin-bottom: 22px; text-align: center; }
        .masa-box label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #8e8e93; font-weight: 700; margin-bottom: 4px; }
        .masa-box input { background: transparent; border: none; color: #ffc107; font-size: 32px; font-weight: 900; text-align: center; width: 100%; outline: none; }

        .status-card { display: none; background: rgba(255, 179, 0, 0.1); border: 1px solid rgba(255, 179, 0, 0.3); border-radius: 16px; padding: 14px; margin-bottom: 20px; text-align: center; }
        .status-title { font-size: 14px; font-weight: 700; color: #ffc107; margin-bottom: 4px; }
        .status-sub { font-size: 12px; color: #ccc; }
        .cancel-btn { background: rgba(255, 59, 48, 0.2); border: 1px solid rgba(255, 59, 48, 0.4); color: #ff453a; font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 8px; margin-top: 8px; cursor: pointer; }

        .btn-grid { display: flex; flex-direction: column; gap: 12px; }
        .btn { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); color: #fff; padding: 18px 20px; border-radius: 18px; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.25s ease; }
        .btn:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.1); }
        
        .btn-koz { background: linear-gradient(135deg, rgba(255, 69, 58, 0.2) 0%, rgba(255, 159, 10, 0.2) 100%); border: 1px solid rgba(255, 69, 58, 0.4); }
        .btn-pos { background: linear-gradient(135deg, rgba(10, 132, 255, 0.2) 0%, rgba(94, 92, 230, 0.2) 100%); border: 1px solid rgba(10, 132, 255, 0.4); }
        
        .btn-tag { font-size: 11px; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px; color: #ddd; }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="app-card">
        <div class="brand">
            <span class="brand-logo">👑</span>
            <h1>VIP LOUNGE</h1>
            <p>Hızlı Müşteri Asistanı</p>
        </div>

        <div class="masa-box">
            <label>MASA NUMARANIZ</label>
            <input type="number" id="masaNo" placeholder="58" value="58">
        </div>

        <div id="statusBox" class="status-card">
            <div id="statusTitle" class="status-title">İsteğiniz İletildi</div>
            <div id="statusSub" class="status-sub">Ekibimiz en kısa sürede masanızda olacaktır.</div>
            <button class="cancel-btn" onclick="iptalEt()">İsteği İptal Et</button>
        </div>

        <div class="btn-grid">
            <button class="btn btn-koz" onclick="gonder('🔥 Köz Tazele / Değiştir')">
                <span>🔥 Köz Tazele</span>
                <span class="btn-tag">Nargile</span>
            </button>
            <button class="btn btn-pos" onclick="gonder('💳 POS / Kart ile Hesap')">
                <span>💳 POS Cihazı ile Hesap</span>
                <span class="btn-tag">Kasa</span>
            </button>
            <button class="btn" onclick="gonder('💵 Nakit Hesap')">
                <span>💵 Nakit Hesap</span>
                <span class="btn-tag">Kasa</span>
            </button>
            <button class="btn" onclick="gonder('🛎️ Garson Çağır')">
                <span>🛎️ Garson Çağır</span>
                <span class="btn-tag">Servis</span>
            </button>
            <button class="btn" onclick="gonder('🧹 Masa Temizliği / Peçete')">
                <span>🧹 Masa Temizliği</span>
                <span class="btn-tag">Hijyen</span>
            </button>
        </div>
    </div>

    <script>
        const socket = io();
        let sonIstek = null;

        function gonder(istek) {
            const masa = document.getElementById('masaNo').value;
            if(!masa) { alert('Lütfen masa numarasını girin!'); return; }

            sonIstek = { masaNo: masa, istek: istek };
            
            socket.emit('musteri_istek', {
                masaNo: masa,
                istek: istek,
                zaman: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
            });

            const statusBox = document.getElementById('statusBox');
            document.getElementById('statusTitle').innerText = '"' + istek + '" İletildi';
            statusBox.style.display = 'block';

            if (navigator.vibrate) navigator.vibrate(50);
        }

        function iptalEt() {
            if(sonIstek) {
                socket.emit('musteri_istek', {
                    masaNo: sonIstek.masaNo,
                    istek: '⚠️ İPTAL EDİLDİ: ' + sonIstek.istek,
                    zaman: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
                });
                document.getElementById('statusBox').style.display = 'none';
                alert('İsteğiniz iptal edildi.');
            }
        }
    </script>
</body>
</html>
